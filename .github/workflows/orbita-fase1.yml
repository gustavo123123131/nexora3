name: Órbita Workspace — Fase 1
on:
  push:
    branches: [fase1-orbita-workspace]
    paths:
      - 'standalone/orbita-workspace/**'
      - '.github/workflows/orbita-fase1.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: standalone/orbita-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar banco, URLs e relações
        run: npm test
      - name: Validar TypeScript e compilar Electron/React
        run: npm run build
      - name: Preparar display virtual Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1
      - name: Validar aplicativo Electron e isolamento real de cookies
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run smoke
      - name: Testar scripts de inicialização do Codespaces
        run: |
          bash -n scripts/setup-codespaces.sh
          bash -n scripts/start-codespaces.sh
          bash -n scripts/status-codespaces.sh
          sudo apt-get install -y x11vnc novnc websockify openbox xdotool
          if ! CODESPACES=true bash scripts/start-codespaces.sh; then
            echo "--- Diagnóstico Electron no ambiente CI ---"
            tail -n 100 "$HOME/.local/share/orbita-codespaces/electron.log" || true
            echo "--- Diagnóstico Xvfb ---"
            tail -n 30 "$HOME/.local/share/orbita-codespaces/display.log" || true
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:6081/vnc.html > /dev/null
          DISPLAY=:98 xdotool search --name 'Órbita Workspace'
      - name: Disponibilizar capturas do aplicativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbita-workspace-capturas
          path: standalone/orbita-workspace/ui-screenshots/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Conferir arquivos executáveis
        run: |
          test -s dist-electron/main.js
          test -s dist-electron/preload.js
          test -s dist/index.html
          test -s dist/assets/$(find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -n 1)
      - name: Gerar pacote do código-fonte
        run: |
          cd ..
          zip -qr orbita-workspace-fase1.zip orbita-workspace \
            -x '*/node_modules/*' '*/dist/*' '*/dist-electron/*' '*/release/*'
      - name: Disponibilizar projeto independente
        uses: actions/upload-artifact@v4
        with:
          name: orbita-workspace-fase1
          path: standalone/orbita-workspace-fase1.zip
          retention-days: 14
          if-no-files-found: error
