name: Testar painel e agente Windows
on:
  push:
    branches: [main, fix/remover-criacao-contas]
  pull_request:
    branches: [fix/remover-criacao-contas]
  workflow_dispatch:
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de teste
        run: |
          python -m pip install -r requirements-web.txt pytest httpx
      - name: Instalar Chromium de testes
        run: python -m playwright install --with-deps chromium
      - name: Verificar sintaxe Python
        run: |
          python -m compileall -q servidor.py agente_windows.py nexora_accounts webui Settings main.py
          python -W error::SyntaxWarning -W error::DeprecationWarning -m py_compile Settings/platform_identity.py
      - name: Verificar sintaxe JavaScript da interface
        run: |
          node --check webui/static/app.js
          node --check webui/static/live_logs.js
          node --check webui/static/proxy_view.js
          node --check webui/static/pix_view.js
          node --check webui/static/accounts_view.js
          node --check webui/static/operations_view.js
          node --check webui/static/backup_view.js
      - name: Chromium real (rotas locais; timeout de diagnóstico)
        run: timeout 60s python -m pytest -vv -s tests/test_identity_chromium.py
      - name: Executar testes sem operacoes externas
        run: |
          python -m pytest -q tests/test_identity_close_warnings.py tests/test_5gbet_observed_id.py tests/test_5gbet_observed_identity.py tests/test_x_object_id.py tests/test_identity_after_click.py tests/test_registration_click_status.py tests/test_registration_status.py tests/test_platform_identity.py tests/test_registration_identity.py
          python -m pytest -q tests/test_live_logs.py
          python -m pytest -q tests/test_account_status_ui.py tests/test_account_delete_ui.py
          python -m pytest -q tests/test_pix_keys.py tests/test_pix_view.py tests/test_operations_view.py tests/test_pix_operations.py tests/test_account_financial_api.py tests/test_pix_browser_session.py tests/test_operations_account_browser_broker.py
          python -m pytest -q tests/test_localhost.py tests/test_agent_windows.py tests/test_device_modes.py tests/test_codespaces_startup.py tests/test_visual_ui.py tests/test_simple_open.py tests/test_registration_autofill.py tests/test_url_normalizer.py tests/test_proxy_workspace.py tests/test_proxy_session_gateway.py tests/test_proxy_diagnostics.py tests/test_account_sessions.py tests/test_account_deletion.py tests/test_account_backups.py tests/test_registration_outcome.py tests/test_account_identity.py tests/test_browser_persistence.py tests/test_profile_recovery.py tests/test_windows_update.py tests/test_auto_updater.py

      - name: Testar janela Chromium mobile real (sem sites externos)
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" python -m pytest -q tests/test_mobile_window.py
      - name: Guardar capturas do redesign
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-visual-preview
          path: ui-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-installer-syntax:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar credenciais locais Windows DPAPI
        run: python -m unittest -q tests/test_windows_dpapi.py
      - name: Validar sintaxe do PowerShell sem executar instalacao
        shell: powershell
        run: |
          $tokens = $null
          $syntaxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'instalar-agente-windows.ps1'),
            [ref]$tokens,
            [ref]$syntaxErrors
          ) | Out-Null
          if ($syntaxErrors.Count -gt 0) {
            $syntaxErrors | Format-List
            exit 1
          }
