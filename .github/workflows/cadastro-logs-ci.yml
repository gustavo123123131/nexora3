name: Cadastro e logs — testes offline
on:
  push:
    branches: [feat/registration-prefill-existing-profiles]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-web.txt pytest httpx
      - name: Verificar sintaxe
        run: |
          python -m compileall -q servidor.py nexora_accounts Settings/Criar_Mae/gui_tab.py Settings/Criar_Filha/gui_tab.py
          node --check webui/static/accounts_view.js
      - name: Executar testes sem cadastro real
        run: python -m pytest -q tests/test_registration_autofill.py tests/test_registration_submit.py tests/test_registration_bridge.py
