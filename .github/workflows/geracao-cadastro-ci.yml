name: Geracao e Cadastro — regressao offline
on:
  push:
    branches: [fix/contas-geracao-senha-fluxo]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-web.txt pytest httpx
      - name: Instalar Chromium para teste de ponta a ponta local
        run: python -m playwright install --with-deps chromium
      - name: Validar sintaxe
        run: |
          python -m compileall -q nexora_accounts servidor.py Settings/Criar_Mae/gui_tab.py Settings/Criar_Filha/gui_tab.py
          node --check webui/static/accounts_view.js
      - name: Testar isolamento, senha e regras de ambiente
        run: python -m pytest -q tests/test_registration_generation.py tests/test_registration_autofill.py tests/test_registration_submit.py tests/test_registration_bridge.py tests/test_account_flow_regression.py tests/test_registration_e2e_local.py
  windows-installer-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe do instalador sem executa-lo
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "instalar-agente-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
